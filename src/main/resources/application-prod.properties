# ============================================================================
# PROD profile - real customers, real data. Strictest settings.
#
# Golden rules encoded below:
# 1. The app NEVER modifies the schema (ddl-auto=validate).
# 2. Logs are lean: INFO and above only. DEBUG/SQL logging would flood
#    storage and can leak customer data into log files.
# 3. All credentials via environment variables, set on the server /
#    hosting platform - they exist nowhere in the codebase.
# ============================================================================

# --- Datasource: Neon branch "production" ---
spring.datasource.url=${DB_URL_PROD}
spring.datasource.username=${DB_USER_PROD}
spring.datasource.password=${DB_PASSWORD_PROD}

# --- JPA / Hibernate ---
# validate = check schema matches entities, never touch it. An app that can
# ALTER production tables on startup is a disaster waiting for a deploy.
# Hibernate only verifies that JPA mappings match the db schema
spring.jpa.hibernate.ddl-auto=validate

# Flyway owns schema migrations
spring.flyway.enabled=true

spring.jpa.show-sql=false

# --- Logging: lean ---
logging.level.com.maz.ai_spring_boot_hotel_booking=INFO
