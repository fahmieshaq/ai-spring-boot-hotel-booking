# ============================================================================
# STAGING profile - the dress rehearsal. As close to prod as possible, so
# problems surface HERE, not in front of customers.
#
# Rule of thumb: staging config should differ from prod ONLY in the
# connection details (and perhaps slightly chattier logging). Every other
# difference is a hole through which a prod-only bug can slip.
# ============================================================================

# --- Datasource: Neon branch "staging" ---
spring.datasource.url=${DB_URL_STAGING}
spring.datasource.username=${DB_USER_STAGING}
spring.datasource.password=${DB_PASSWORD_STAGING}

# --- JPA / Hibernate ---
# validate = Hibernate only CHECKS that tables match the @Entity classes;
# it never creates or alters anything. Mismatch = startup failure.
# Schema changes reach staging/prod via migration tools (Flyway - later
# topic), not via Hibernate guessing ALTER TABLE statements.
spring.jpa.hibernate.ddl-auto=validate

# Flyway owns schema migrations
spring.flyway.enabled=true

# No SQL logging: mimic prod behavior (and prod log volume).
spring.jpa.show-sql=false

# --- Logging: like prod ---
logging.level.com.maz.ai_spring_boot_hotel_booking=INFO
