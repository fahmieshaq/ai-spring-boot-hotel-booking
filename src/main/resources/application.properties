# ============================================================================
# BASE configuration - loaded in EVERY environment.
# Only settings that are IDENTICAL across dev/staging/prod belong here.
# Environment-specific settings (DB url, credentials, ddl-auto, log levels)
# live in application-<profile>.properties files, loaded ON TOP of this one.
#
# How profiles work:
# - Start the app with a profile: SPRING_PROFILES_ACTIVE=dev (env var)
#   or --spring.profiles.active=dev (command line)
# - Spring loads: application.properties + application-dev.properties
# - Values in the profile file OVERRIDE values here (last one wins)
# ============================================================================

# Application name shown in logs / monitoring / Spring Boot startup output
spring.application.name=ai-spring-boot-hotel-booking

# If no profile is explicitly set, act as "dev".
# Safe default: a developer cloning the repo can never accidentally run
# against staging/prod - reaching those REQUIRES an explicit choice.
spring.profiles.default=dev

# JDBC driver class for PostgreSQL (same in all environments)
spring.datasource.driver-class-name=org.postgresql.Driver

# Tell Hibernate to generate SQL for PostgreSQL specifically.
# This is the dialect used to adapt SQL syntax to PostgreSQL.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Springdoc OpenAPI configuration
# Exposes OpenAPI JSON documentation at /api-docs.
springdoc.api-docs.path=/api-docs

# Exposes Swagger UI at /swagger-ui.html.
springdoc.swagger-ui.path=/swagger-ui.html

#################### notes ##################
#One important note:
#
#In PostgreSQL, the database usually must already exist before the app connects.
#
#The URL pattern createDatabaseIfNotExist=true is more common with MySQL, not PostgreSQL.
#
#For PostgreSQL, the normal flow is:
#1.
#create the DB manually with psql or pgAdmin
#2.
#then let Spring Boot connect to it
#
#################
#These are two different ways of viewing the same API documentation:
#
#/api-docs
#
#This is the raw OpenAPI document
#
#Usually returned as JSON
#
#Example: http://localhost:8080/api-docs
#
#It is machine-readable
#
#Used by tools, frontends, API clients, Swagger code generators, testing tools
#
#/swagger-ui.html
#
#This is the human-friendly Swagger UI page
#
#It reads the OpenAPI JSON and renders a browser interface
#
#You click endpoints, try requests, see request/response samples
#
#This is the visual documentation you usually show to developers or testers
#In simple terms:
#
#/api-docs = data
#
#/swagger-ui.html = UI for reading and testing the data
