# ============================================================================
# DEV profile - your personal playground. Loaded ON TOP of application.properties
# when the active profile is "dev" (which is our default, see base file).
#
# Credentials come from ENVIRONMENT VARIABLES, never hardcoded:
#   ${DB_URL_DEV}     e.g. jdbc:postgresql://ep-xxx.neon.tech/neondb?sslmode=require
#   ${DB_USER_DEV}    e.g. neondb_owner
#   ${DB_PASSWORD_DEV}
#
# Why env vars even for dev?
# 1. This file goes into git - a password here would be published forever
#    (git history keeps it even after deletion).
# 2. Same mechanism as prod = one habit, no exceptions to remember.
#
# The ${VAR} syntax: Spring resolves it from environment variables (or JVM
# -D properties) at startup. Missing variable = startup failure with a clear
# error - fail fast, no silent defaults for credentials.
# ============================================================================

# --- Datasource: Neon branch "dev" ---
spring.datasource.url=${DB_URL_DEV}
spring.datasource.username=${DB_USER_DEV}
spring.datasource.password=${DB_PASSWORD_DEV}

# --- JPA / Hibernate ---
# update = create missing tables / add missing columns from @Entity classes.
# Convenient for dev: schema follows your code automatically.
#spring.jpa.hibernate.ddl-auto=update

# Flyway owns schema migrations
# The exact sequence when you run the app:
#1. Spring Boot starts
#2. Flyway connects to the DB (same URL/credentials from your profile)
#3. Looks for its history table (flyway_schema_history)
#→ not there (first run) → creates it
#4. Scans classpath:db/migration → finds V1__create_tables.sql
#5. Checks history: has V1 run? No
#6. Executes V1 → hotel, room, booking tables created
#7. Records row in flyway_schema_history: version 1, checksum, success
#8. Hibernate starts, ddl-auto=validate → checks entities vs tables → match ✅
#9. Tomcat starts → app ready
spring.flyway.enabled=true

# Hibernate only verifies that JPA mappings match the db schema
spring.jpa.hibernate.ddl-auto=validate

# Log every SQL statement Hibernate generates so we can learn and debug.
spring.jpa.show-sql=true

# Pretty-print SQL in logs for better readability.
spring.jpa.properties.hibernate.format_sql=true

# --- Logging: maximum insight, noise is fine in dev ---
# Log SQL generated by Hibernate at DEBUG level.
logging.level.org.hibernate.SQL=DEBUG

# Log parameter values bound to SQL queries.
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Our own code: DEBUG (shows DEBUG + INFO + WARN + ERROR).
logging.level.com.maz.ai_spring_boot_hotel_booking=DEBUG
